name: peridot
description: "Nostr bunker for desktop."
publish_to: 'none'
version: 1.3.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_highlight: ^0.7.0
  flutter_local_notifications: ^20.0.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  get: ^4.7.3
  google_fonts: ^8.0.0
  intl: any
  launch_at_startup: ^0.5.1
  ndk: ^0.7.1-dev.2
  nip49: ^1.1.2
  nostr_bunker: ^1.3.3
  nostr_widgets: ^1.2.2
  path: ^1.9.1
  path_provider: ^2.1.5
  sembast: ^3.8.6
  sembast_web: ^2.4.4
  toastification: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
