name: peridot
description: "Nostr bunker for desktop."
publish_to: 'none'
version: 1.3.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_highlight: ^0.7.0
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.4
  get: ^4.7.3
  google_fonts: ^9.0.0
  intl: ^0.20.3
  # win32_registry 3 port (leanflutter/launch_at_startup#41), needed for win32 6
  launch_at_startup:
    git:
      url: https://github.com/ashim-kr-saha/launch_at_startup.git
      ref: da79f797071fb716d3ff3c82e726272c3ec20a3c
  ndk: ^0.10.0
  ndk_flutter: ^0.10.0
  nip49: ^1.1.2
  nostr_bunker: ^1.4.1
  path: ^1.9.1
  path_provider: ^2.1.6
  sembast: ^3.8.11
  sembast_web: ^2.4.6
  toastification: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
