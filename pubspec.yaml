name: peridot
description: "Nostr bunker for desktop."
publish_to: 'none'
version: 1.3.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_highlight: ^0.7.0
  flutter_local_notifications: ^22.2.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  get: ^4.7.3
  google_fonts: ^8.2.0
  intl: any
  launch_at_startup: ^0.5.1
  ndk: ^0.8.4-dev.11
  ndk_flutter: ^0.8.4-dev.14
  nip49: ^1.1.2
  nostr_bunker: ^1.4.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sembast: ^3.8.9+1
  sembast_web: ^2.4.5+1
  toastification: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
