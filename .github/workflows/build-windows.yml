name: Build Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install FastForge and Inno Setup
        run: |
          dart pub global activate fastforge 0.6.12
          choco install innosetup -y --no-progress

      - name: Get dependencies
        run: flutter pub get

      - name: Get version from pubspec
        id: version
        run: |
          $yaml = Get-Content pubspec.yaml
          $version = ($yaml | Select-String "version:\s*(.+)").Matches.Groups[1].Value
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      - name: Build installer
        run: dart pub global run fastforge package --platform windows --targets exe --skip-clean

      - name: Create zip archive
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/${{ steps.version.outputs.VERSION }}/peridot-${{ steps.version.outputs.VERSION }}-windows-portable.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*/*

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
