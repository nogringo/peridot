name: Build Linux App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libsecret-1-dev
          sudo wget -q -O /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install FastForge
        run: dart pub global activate fastforge

      - name: Get dependencies
        run: flutter pub get

      - name: Get version from pubspec
        id: version
        run: |
          VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Build deb and AppImage
        env:
          # The runner has no FUSE, so appimagetool must unpack itself instead of mounting.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: fastforge package --platform linux --targets deb,appimage --skip-clean --artifact-name '{{name}}-{{version}}-{{platform}}-x64.{{ext}}'

      - name: Create tar.gz archive
        run: |
          mv build/linux/x64/release/bundle build/linux/x64/release/peridot
          tar -czf dist/${{ steps.version.outputs.VERSION }}/peridot-${{ steps.version.outputs.VERSION }}-linux-x64.tar.gz -C build/linux/x64/release peridot

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/*/*

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
