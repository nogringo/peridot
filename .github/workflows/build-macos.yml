name: Build macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Install signing certificate and provisioning profile
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.provisionprofile
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$MACOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Xcode 16+ reads profiles from UserData, older versions from MobileDevice.
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROFILE_PATH" "$dir/$PROFILE_UUID.provisionprofile"
          done

      - name: Build macOS app
        run: flutter build macos --release

      - name: Get version from pubspec
        id: version
        run: |
          VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Create DMG
        run: |
          npm install -g create-dmg
          create-dmg 'build/macos/Build/Products/Release/Peridot.app' build/macos/Build/Products/Release/ || true
          mv build/macos/Build/Products/Release/*.dmg build/macos/Build/Products/Release/peridot-${{ steps.version.outputs.VERSION }}-macos.dmg || true

      - name: Notarize DMG
        env:
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          DMG_PATH=build/macos/Build/Products/Release/peridot-${{ steps.version.outputs.VERSION }}-macos.dmg
          KEY_PATH=$RUNNER_TEMP/notary_key.p8
          echo -n "$NOTARY_API_KEY_BASE64" | base64 --decode -o "$KEY_PATH"
          NOTARY_AUTH=(--key "$KEY_PATH" --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER_ID")

          # notarytool exits 0 even when Apple rejects the submission.
          RESULT=$(xcrun notarytool submit "$DMG_PATH" "${NOTARY_AUTH[@]}" --wait --output-format json)
          echo "$RESULT"
          if [ "$(echo "$RESULT" | jq -r .status)" != "Accepted" ]; then
            xcrun notarytool log "$(echo "$RESULT" | jq -r .id)" "${NOTARY_AUTH[@]}"
            exit 1
          fi

          xcrun stapler staple "$DMG_PATH"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            build/macos/Build/Products/Release/Peridot.app
            build/macos/Build/Products/Release/*.dmg

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/macos/Build/Products/Release/*.dmg
            build/macos/Build/Products/Release/Peridot.app
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
